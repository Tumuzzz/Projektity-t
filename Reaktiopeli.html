<!DOCTYPE html>
<html>
<head>
    <title>Reaktiopeli</title>
</head>
<body>

<h1>Reaktiopeli</h1>

<p id="teksti">Odota, että ruutu muuttuu vihreäksi!</p>

<div id="ruutu" onclick="klikkaus()"
     style="width: 400px; height: 250px; background-color: red;">
</div>

<script>
    let aloitus;

    // Ruutu muuttuu vihreäksi satunnaisen ajan jälkeen
    let aika = Math.random() * 3000 + 2000;

    setTimeout(function() {
        document.getElementById("ruutu").style.backgroundColor = "green";
        document.getElementById("teksti").innerHTML = "KLIKKAA NYT!";

        aloitus = Date.now();
    }, aika);

    function klikkaus() {
        if (document.getElementById("ruutu").style.backgroundColor == "green") {
            let loppu = Date.now();
            let reaktioaika = loppu - aloitus;

            document.getElementById("teksti").innerHTML =
                "Reaktioaikasi: " + reaktioaika + " ms";
        }
        else {
            document.getElementById("teksti").innerHTML =
                "Liian aikaisin! Odota vihreää.";
        }
    }
</script>

</body>
</html>
